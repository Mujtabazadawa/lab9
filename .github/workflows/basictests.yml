name: basictests
on:
   push:
     branches: [main]
jobs:
  lab9-basics-tests:
    runs-on: ubuntu-latest
    steps:
      -name: Checkout repository
       uses: actions/checkout@v4
      -name: Make script executable
       run:  chmod +x ./validate-data.sh
      -name: Run and verify output
       run: |
         Output =$(bash validate-data.sh "pearse mccarthy" "0838668736")
         echo "Script output was : $output "
         if [ "$Output" == " PASS" ]; then echo "Test passed"; else echo "Test failed";  exit1; fi

